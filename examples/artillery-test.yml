# Example Artillery test using the plugin.
#   npm i -D artillery loadlens-html
#   npx artillery run examples/artillery-test.yml
config:
  target: https://httpbin.org
  phases:
    - duration: 30
      arrivalRate: 2
      rampTo: 5
      name: Ramp up
  plugins:
    metrics-by-endpoint: {}
    html:
      scope: "loadlens-"
      output: reports/{name}-{timestamp}.html
      title: httpbin smoke load
      labels:
        env: example
      failOn: fail
      summaryJson: reports/summary.json
      thresholds:
        httpResponseTime: { stat: p95, warn: 800, fail: 2000 }
        checks:
          - label: /get p99
            metric: "plugins.metrics-by-endpoint.response_time./get"
            stat: p99
            fail: 3000

scenarios:
  - name: Read endpoints
    flow:
      - get:
          url: /get
      - get:
          url: /status/200
